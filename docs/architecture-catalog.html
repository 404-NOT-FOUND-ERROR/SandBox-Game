<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群岛建筑图鉴</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eee9dd;color:#293f4d;font-family:'Microsoft YaHei',sans-serif;padding:30px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}h1{margin:0;font-size:34px}header p{max-width:510px;line-height:1.7;font-size:14px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}article{background:#faf6ea;border:1px solid #b8b9ab;padding:15px 18px;border-radius:12px}h2{margin:0;font-size:22px}article p{font-size:12px;margin:6px 0;color:#69807c;min-height:17px}img{width:100%;height:auto;display:block}footer{display:flex;justify-content:space-around;font-size:14px;font-weight:700;margin:4px 0}</style>
<style>@media(max-width:800px){body{padding:16px}.grid{grid-template-columns:1fr}header{display:block}h1{font-size:26px}header p{margin-top:12px}footer{font-size:12px}}</style>
<header><h1>同一个世界，十种建筑想象。</h1><p>实机几何与 PBR 材质 · 每个街区三种建筑<br>统一光照、材质与轮廓，各地保留自己的结构与生活。</p></header><main class="grid"></main>
<script type="module">
import * as THREE from '../vendor/three-0.161.0/three.module.js';
import {createWorldStyle} from '../world-style.js';
import {ARCHITECTURE,architectureGeometry,buildingRecipe} from '../world-architecture.js';
import {CITY_DISTRICTS} from '../world-city.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(690,320);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(),style=createWorldStyle(THREE,renderer,scene);scene.background=new THREE.Color(0xfaf6ea);
scene.add(new THREE.HemisphereLight(0xfff3dc,0x719485,1.3));
const sun=new THREE.DirectionalLight(0xffedce,2.6);sun.position.set(-4,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;sun.shadow.normalBias=.04;scene.add(sun);
const camera=new THREE.OrthographicCamera(-9.6,9.6,4.45,-4.45,.1,100);camera.position.set(10,9,18);camera.lookAt(0,2.6,0);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),style.material(0xebe9d8,{},'stone'));floor.rotation.x=-Math.PI/2;floor.position.y=-.45;floor.receiveShadow=true;scene.add(floor);
const geometries=new Map(),materials=new Map();
const ink=new THREE.ShaderMaterial({side:THREE.BackSide,vertexShader:'void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position+normal*.012,1.);}',fragmentShader:'void main(){gl_FragColor=vec4(.075,.1,.11,1.);}'});
for(const d of CITY_DISTRICTS){
 const root=new THREE.Group();scene.add(root);
 for(let i=0;i<3;i++){
  const house=new THREE.Group();house.position.x=(i-1)*5;house.rotation.y=-.24;root.add(house);
  for(const part of buildingRecipe(THREE,d,i).parts){
   if(!geometries.has(part.shape))geometries.set(part.shape,architectureGeometry(THREE,part.shape));
   const key=part.surface+part.color;if(!materials.has(key))materials.set(key,style.material(part.color,{},part.surface));
   const mesh=new THREE.Mesh(geometries.get(part.shape),materials.get(key));mesh.position.set(...part.position);mesh.scale.set(...part.scale);if(part.quaternion)mesh.quaternion.fromArray(part.quaternion);else mesh.rotation.set(...part.rotation,part.rotationOrder);mesh.castShadow=!['glass','light','aether'].includes(part.surface);mesh.receiveShadow=true;house.add(mesh);
   if(part.surface!=='glass'){const hull=new THREE.Mesh(mesh.geometry,ink);mesh.add(hull);}
  }
 }
 renderer.render(scene,camera);
 const card=document.createElement('article');card.innerHTML=`<h2>${d.name}</h2><p>${ARCHITECTURE[d.id].life}</p><img alt="${d.name}三种建筑" src="${renderer.domElement.toDataURL()}"><footer>${ARCHITECTURE[d.id].types.map(t=>`<span>${t}</span>`).join('')}</footer>`;document.querySelector('main').append(card);scene.remove(root);
}
window.catalogReady=true;
</script></html>
