<div id="app"></div>
<section id="panel" aria-label="浮屿工坊控制面板">
  <div class="eyebrow">NO CUBES · TOON ISLAND · SANDBOX</div><h1>浮屿工坊</h1><div class="small">把一座会呼吸的岛，变成你的手办世界。</div>

  <div class="rule"></div>
  <div class="toggle"><span>反向外壳描边</span><input id="outline" type="checkbox" checked aria-label="反向外壳描边"/></div>
  <div class="row"><button id="camera" class="secondary grow">视角：跟随</button><button id="autoTime" class="secondary grow">时间：自动</button></div>
  <label for="time">太阳时间 <span id="timeLabel" class="value">10:30</span></label><input id="time" type="range" min="0" max="24" step="0.05" value="10.5"/>

  <div class="rule"></div>
  <div class="chips"><div class="chip"><span class="swatch" style="background:#c48a52"></span>木材<b id="wood">0</b></div><div class="chip"><span class="swatch" style="background:#8a8d82"></span>石头<b id="stone">0</b></div><div class="chip"><span class="swatch" style="background:#ffca45"></span>种子<b id="seedCount">0</b></div></div>
  <div class="row"><button id="campfire" class="teal grow">制作篝火 <span class="small">3木·2石</span></button><button id="bench" class="teal grow">制作长凳 <span class="small">4木·1石</span></button></div>
  <div class="row"><button id="plant" class="secondary grow">种下花种</button><span class="small grow">岛屿心愿：点亮营地，再让花朵在坡地扎根。</span></div>
</section>
<div id="hint"><b>岛屿日记</b><span id="progress">找到木材、石头与发光种子，给岛屿添一处温暖的落脚点。</span></div>
<div id="touchControls" aria-label="触屏控制"><div class="pad"><button data-dir="up" aria-label="向前">↑</button><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向后">↓</button><button data-dir="right" aria-label="向右">→</button></div><div class="touch-actions"><button data-action="jump" aria-label="跳跃">跳跃</button><button data-action="collect" aria-label="采集">采集</button><button data-action="plant" aria-label="种植">种植</button></div></div>
<div id="toast" role="status"></div><div id="reticle"><i class="reticle-line h"></i><i class="reticle-line v"></i></div>

  function buildWorld(reset=true){clearWorld();state.seed=$('seed').value.trim()||'LUMEN-07';if(reset){state.terrainOps=[];state.placed=[];state.collected=[];state.wood=0;state.stone=0;state.seeds=0;state.crafted=0;state.planted=0;state.terrainEdits=0}seedHash=hashString(state.seed);rng=rand;world={terrain:makeTerrain(),water:makeWater()};for(let i=0;i<40;i++){const a=rand()*TAU,r=8+rand()*28,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(terrainHeight(x,z))<-.65)continue;if(rand()<.7)makeTree(x,z,terrainHeight(x,z)>3.4);else makeRock(x,z)}let pickupId=0;for(const type of ['wood','stone','seed']){for(let n=0;n<8;n++){let x=0,z=0,tries=0;do{const a=rand()*TAU,r=7+rand()*27;x=Math.cos(a)*r;z=Math.sin(a)*r;tries++}while(terrainHeight(x,z)<-.5&&tries<40);makePickup(type,x,z,pickupId++)}}for(let i=0;i<8;i++){const a=rand()*TAU,r=12+rand()*30;makeCloud(Math.cos(a)*r,16+rand()*7,Math.sin(a)*r,1.4+rand())}if(player){player.position.set(0,terrainHeight(0,0)+.02,0)}const pos=world.terrain.geometry.attributes.position;for(let i=0;i<pos.count;i++)pos.setY(i,terrainHeight(pos.getX(i),pos.getZ(i)));pos.needsUpdate=true;world.terrain.geometry.computeVertexNormals();if(!reset){for(const p of state.placed){if(p.type==='flower')plant(p);else placeCraft(p.type,p)}for(const id of state.collected){const g=pickups.find(item=>item.userData.id===id&&item.parent);if(g)g.parent.remove(g)}}if(player)player.traverse(m=>{if(m.userData.outline&&!outlines.includes(m.userData.outline))outlines.push(m.userData.outline)});updateResourceUI();toggleOutlines();if(reset)toast('新岛屿已生成：'+state.seed)}
  function updateResourceUI(){$('wood').textContent=state.wood;$('stone').textContent=state.stone;$('seedCount').textContent=state.seeds;$('progress').textContent=state.crafted>=2&&state.planted>=3?'岛屿已拥有自己的小小生活。截图留住它吧。':state.crafted>=1?'篝火亮起来了，再种下三朵花完成你的第一处营地。':'找到木材、石头与发光种子，给岛屿添一处温暖的落脚点。'}
  function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200)}
  function timeText(t){const h=Math.floor(t)%24,m=Math.floor((t-Math.floor(t))*60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
  function setTime(t){state.time=((t%24)+24)%24;$('time').value=state.time;$('timeLabel').textContent=timeText(state.time)}
  function updateLighting(dt){if(state.autoTime)setTime(state.time+dt*.16);const angle=(state.time/24)*TAU-Math.PI/2;sun.position.set(Math.cos(angle)*34,Math.sin(angle)*35+9,Math.sin(angle*.75)*26);sun.target.position.set(0,0,0);const daylight=Math.max(0,Math.sin(angle)*.5+.55);sun.intensity=.75+daylight*2.25;hemi.intensity=.65+daylight*1.05;const sky=new THREE.Color().setHSL(.47,.48,.56+daylight*.16);scene.background.lerp(sky,.06);scene.fog.color.copy(scene.background)}
  function nearest(list,max=2.3){let best=null,bd=max;for(const g of list){if(!g.parent)continue;const d=player.position.distanceTo(g.position);if(d<bd){bd=d;best=g}}return best}
  function collect(){const g=nearest(pickups,2.4);if(!g){toast('靠近发光物件再按 E');return}state[g.userData.type==='seed'?'seeds':g.userData.type]++;state.collected.push(g.userData.id);g.parent.remove(g);const idx=pickups.indexOf(g);if(idx>=0)pickups.splice(idx,1);toast('收集 '+(g.userData.type==='wood'?'木材':g.userData.type==='stone'?'石头':'发光种子'));updateResourceUI()}
  function placeCraft(type,restore=null){const cost=type==='campfire'?{wood:3,stone:2}:{wood:4,stone:1};if(!restore&&(state.wood<cost.wood||state.stone<cost.stone)){toast('资源还不够：需要 '+cost.wood+'木 · '+cost.stone+'石');return}if(!restore){state.wood-=cost.wood;state.stone-=cost.stone;state.crafted++}const g=new THREE.Group();const x=restore?.x??player.position.x,z=restore?.z??player.position.z;g.position.set(x,terrainHeight(x,z),z);if(type==='campfire'){for(let i=0;i<6;i++){const log=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,.9,7),mats.wood);log.rotation.set(0, i*TAU/6,Math.PI/2);log.position.y=.18;g.add(log)}const fire=new THREE.Mesh(new THREE.SphereGeometry(.3,8,6),mats.fire);fire.scale.y=1.7;fire.position.y=.7;g.add(fire);g.userData.fire=fire;dynamic.push(g)}else{const seat=new THREE.Mesh(new THREE.CylinderGeometry(.24,.28,1.5,8),mats.bench);seat.rotation.z=Math.PI/2;seat.position.y=.55;g.add(seat);for(const x of [-.53,.53]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.1,.12,.6,7),mats.wood);leg.position.set(x,.22,0);g.add(leg)}}g.userData.placeType=type;meshWithOutline(g,1.07);scene.add(g);props.push(g);if(!restore)state.placed.push({type,x,z});if(!restore)toast(type==='campfire'?'篝火已点亮':'长凳已放下');updateResourceUI()}
  function plant(restore=null){if(!restore&&state.seeds<1){toast('还没有发光种子');return}const x=restore?.x??player.position.x+(rand()-.5)*1.8,z=restore?.z??player.position.z+(rand()-.5)*1.8;if(Math.hypot(x,z)>37){toast('请在岛屿内部种植');return}if(!restore){state.seeds--;state.planted++;state.placed.push({type:'flower',x,z})}const flower=makeFlower(x,z,'plant');plants.push(flower);if(!restore)toast('一朵花在这里扎根');updateResourceUI()}
  function sculpt(mode){const cx=player.position.x,cz=player.position.z;if(Math.hypot(cx,cz)>37){toast('海浪边缘无法塑形');return}const radius=5;if(mode==='smooth'){let total=0,count=0;for(let a=0;a<12;a++){const ang=a*TAU/12;total+=terrainHeight(cx+Math.cos(ang)*radius*.65,cz+Math.sin(ang)*radius*.65);count++}state.terrainOps.push({type:'smooth',x:cx,z:cz,radius,amount:.3,target:total/count})}else state.terrainOps.push({type:mode,x:cx,z:cz,radius,amount:mode==='raise'?.45:-.45});const pos=world.terrain.geometry.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,terrainHeight(x,z))}pos.needsUpdate=true;world.terrain.geometry.computeVertexNormals();const hull=world.terrain.userData.outline;if(hull){hull.geometry.dispose();hull.geometry=world.terrain.geometry.clone()}for(const g of [...props,...plants])g.position.y=terrainHeight(g.position.x,g.position.z);for(const g of pickups)g.userData.baseY=terrainHeight(g.position.x,g.position.z)+.5;state.terrainEdits++;toast(mode==='raise'?'地形向上长了一点':mode==='lower'?'地形向下沉了一点':'地形变得更柔和了');}
  function jump(){if(onGround){playerVelocity.y=8.2;onGround=false;state.jumped=true}}
  function movePlayer(dt){let x=0,z=0;if(keys.has('KeyW')||keys.has('ArrowUp'))z-=1;if(keys.has('KeyS')||keys.has('ArrowDown'))z+=1;if(keys.has('KeyA')||keys.has('ArrowLeft'))x-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))x+=1;const len=Math.hypot(x,z)||1;const speed=8;player.position.x+=x/len*speed*dt;player.position.z+=z/len*speed*dt;const r=Math.hypot(player.position.x,player.position.z);if(r>40){player.position.x*=40/r;player.position.z*=40/r}playerVelocity.y-=21*dt;player.position.y+=playerVelocity.y*dt;const floor=terrainHeight(player.position.x,player.position.z)+.03;if(player.position.y<=floor){player.position.y=floor;playerVelocity.y=0;onGround=true}else onGround=false;if(x||z)player.rotation.y=Math.atan2(x,z);}
  function updateCamera(dt){if(state.camera==='follow'){const target=new THREE.Vector3(player.position.x,player.position.y+1,player.position.z);const desired=new THREE.Vector3(player.position.x+37,player.position.y+37,player.position.z+37);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target)}else{const radius=65,ang=elapsed*.16;camera.position.lerp(new THREE.Vector3(Math.cos(ang)*radius,38,Math.sin(ang)*radius),1-Math.pow(.001,dt));camera.lookAt(0,1,0)}}
  function updateDynamics(t){for(const g of dynamic){if(g===world?.water?.water){g.material.opacity=.46+Math.sin(t*1.4)*.05;g.scale.setScalar(1+Math.sin(t*.8)*.006)}else if(g.userData.baseX!==undefined){g.position.x=g.userData.baseX+Math.sin(t*g.userData.speed*.18)*3;g.position.y+=Math.sin(t*.3+g.position.z)*.0005}else if(g.userData.type){g.position.y=g.userData.baseY+Math.sin(t*2.8+g.position.x)*.16}else if(g.userData.fire){g.userData.fire.scale.y=1.55+Math.sin(t*8)*.22}}for(let i=0;i<world.water.rings.length;i++)world.water.rings[i].scale.setScalar(1+Math.sin(t*1.4+i)*.018)}
  function snapshot(){return {...state,seed:state.seed,player:{x:player.position.x,y:player.position.y,z:player.position.z},collected:[...state.collected]}}
  function save(){localStorage.setItem('floating-isle-save',JSON.stringify(snapshot()));toast('进度已保存到本机')}
  function restoreData(data){if(!data||typeof data!=='object'||typeof data.seed!=='string')throw new Error('invalid save');Object.assign(state,data);state.terrainOps=Array.isArray(data.terrainOps)?data.terrainOps:[];state.placed=Array.isArray(data.placed)?data.placed:[];state.collected=Array.isArray(data.collected)?data.collected:[];$('seed').value=state.seed;buildWorld(false);if(data.player)player.position.set(data.player.x,data.player.y,data.player.z);state.wood=Number(data.wood)||0;state.stone=Number(data.stone)||0;state.seeds=Number(data.seeds)||0;setTime(state.time);$('outline').checked=state.outline;$('autoTime').textContent='时间：'+(state.autoTime?'自动':'手动');$('camera').textContent='视角：'+(state.camera==='follow'?'跟随':'自转');toggleOutlines();updateResourceUI()}
  function load(){const raw=localStorage.getItem('floating-isle-save');if(!raw){toast('还没有保存记录');return}try{restoreData(JSON.parse(raw));toast('已读取 '+state.seed)}catch(e){toast('保存文件不可用')}}
  function exportJSON(){const blob=new Blob([JSON.stringify({...state,seed:$('seed').value},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='floating-isle-save.json';a.click();URL.revokeObjectURL(a.href);toast('JSON 已导出')}
  function toggleOutlines(){state.outline=$('outline').checked;for(const h of outlines)h.visible=state.outline}
  $('regen').onclick=buildWorld;$('save').onclick=save;$('load').onclick=load;$('export').onclick=()=>{const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='floating-isle-save.json';a.click();URL.revokeObjectURL(a.href);toast('JSON 已导出')};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{restoreData(JSON.parse(reader.result));toast('JSON 世界已导入')}catch(err){toast('JSON 格式不正确')}};reader.readAsText(file)};
  $('outline').onchange=toggleOutlines;$('camera').onclick=()=>{state.camera=state.camera==='follow'?'orbit':'follow';$('camera').textContent='视角：'+(state.camera==='follow'?'跟随':'自转');toast(state.camera==='follow'?'镜头跟随角色':'镜头开始自转')};$('autoTime').onclick=()=>{state.autoTime=!state.autoTime;$('autoTime').textContent='时间：'+(state.autoTime?'自动':'手动');toast(state.autoTime?'昼夜开始流转':'时间已锁定')};$('time').oninput=e=>{state.autoTime=false;$('autoTime').textContent='时间：手动';setTime(Number(e.target.value))};$('raise').onclick=()=>sculpt('raise');$('lower').onclick=()=>sculpt('lower');$('smooth').onclick=()=>sculpt('smooth');$('campfire').onclick=()=>placeCraft('campfire');$('bench').onclick=()=>placeCraft('bench');$('plant').onclick=()=>plant();$('shot').onclick=()=>{const a=document.createElement('a');a.download='floating-isle.png';a.href=renderer.domElement.toDataURL('image/png');a.click();toast('截图已保存')};
  addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;keys.add(e.code);if(e.code==='Space'){e.preventDefault();jump()}if(e.code==='KeyE')collect();if(e.code==='KeyP')plant();if(e.code==='KeyC')placeCraft('campfire');if(e.code==='KeyB')placeCraft('bench');if(e.code==='KeyR')sculpt('raise');if(e.code==='KeyF')sculpt('lower');if(e.code==='KeyG')sculpt('smooth')});addEventListener('keyup',e=>keys.delete(e.code));
  addEventListener('resize',()=>{const a=innerWidth/innerHeight;const h=cameraSpan/a;camera.left=-cameraSpan/2;camera.right=cameraSpan/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  for(const button of document.querySelectorAll('#touchControls [data-dir]')){const code={up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD'}[button.dataset.dir];button.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(code);button.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,()=>keys.delete(code))}for(const button of document.querySelectorAll('#touchControls [data-action]'))button.addEventListener('click',()=>({jump,collect,plant}[button.dataset.action])());
  buildWorld(); player=makePlayer(); setTime(state.time); updateResourceUI();
  function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;movePlayer(dt);updateLighting(dt);updateCamera(dt);updateDynamics(elapsed);renderer.render(scene,camera)} loop();
})();
</script>
